<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonjour Léa 🐔</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <div class="scene" id="scene">
            <img src="images/bg.png" class="background" id="background" alt="">

            <button class="chicken-button" id="chickenButton" aria-label="Cliquer sur la poule">
                <img src="images/chicken.png" class="chicken" id="chicken" alt="Petite poule">
            </button>

            <div class="speech" id="speech">
                <p id="dialogue"></p>
            </div>

            <div class="effects" id="effects"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
